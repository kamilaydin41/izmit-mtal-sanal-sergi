
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifre Yenileme - İzmit MTAL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main style="max-width:480px;margin:60px auto;background:white;padding:30px;border-radius:10px;">
    <h1>Yeni Şifre Belirle</h1>
    <p>Yönetici hesabınız için yeni bir şifre oluşturun.</p>

    <p id="message" class="err" role="alert">
      Bağlantı kontrol ediliyor...
    </p>

    <form id="reset-form" class="hidden">
      <label>
        Yeni şifre
        <input id="password" type="password"
          minlength="8" autocomplete="new-password" required>
      </label>

      <label style="display:block;margin-top:15px">
        Yeni şifre (tekrar)
        <input id="password2" type="password"
          minlength="8" autocomplete="new-password" required>
      </label>

      <button type="submit" style="margin-top:20px">
        Şifremi Güncelle
      </button>
    </form>

    <p><a href="admin.html">Yönetim paneline dön</a></p>
  </main>

  <script type="module" src="reset-password.js"></script>
</body>
</html>
